kind = "api"
previewPath = "/api"
title = "Portfolio API (C# ASP.NET Core)"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd /home/runner/workspace/artifacts/portfolio-api && PORT=8080 dotnet run --urls http://0.0.0.0:8080"

[services.production]

[services.production.build]
args = ["dotnet", "publish", "/home/runner/workspace/artifacts/portfolio-api", "-c", "Release", "-o", "/home/runner/workspace/artifacts/portfolio-api/publish"]

[services.production.run]
args = ["dotnet", "/home/runner/workspace/artifacts/portfolio-api/publish/PortfolioApi.dll"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
